<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Longtweet Studio</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0b1020;color:#eef2ff}*{box-sizing:border-box}body{margin:0}header{background:#161f34;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid #33405c}header a{color:#a4bdff;text-decoration:none;font-weight:700}main{max-width:1150px;margin:26px auto;padding:0 20px}.panel,.card{background:#161f34;border:1px solid #33405c;border-radius:15px;padding:22px;margin-bottom:15px}h1{margin-top:0}.muted{color:#a5b6d1}.btn{background:#3e5fea;border:1px solid #7186ec;color:white;border-radius:9px;padding:10px 14px;cursor:pointer;font:inherit;display:inline-block;text-decoration:none}.secondary{background:#293a59}.danger{background:#813746}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input,select,textarea{background:#0c1427;border:1px solid #52617e;border-radius:9px;color:white;padding:11px;font:inherit;max-width:100%}input[type=text],input[type=password],input[type=search],textarea{width:100%}textarea{min-height:380px;resize:vertical}label{display:block;margin:12px 0 6px;font-weight:600}.preview{background:#0c1427;border:1px solid #394a68;padding:18px;border-radius:10px;min-height:200px;overflow-wrap:anywhere;line-height:1.65}.preview pre{white-space:pre-wrap}.preview blockquote{border-left:3px solid #688aff;padding-left:12px;margin-left:0}.tag{font-size:12px;background:#34466a;padding:4px 9px;border-radius:30px;margin-right:5px}#notice{color:#a6c4ff;min-height:24px;margin-bottom:12px}.card h2{margin-bottom:6px;overflow-wrap:anywhere}.card p{color:#b0bed6;overflow-wrap:anywhere}@media(max-width:750px){.editgrid{grid-template-columns:1fr}}
</style></head><body><header><a href="/">Longtweet Studio</a><nav class="row"><a href="/posts">Explore</a><button class="btn secondary" id="admin">Admin</button></nav></header><main><div id="notice" role="status"></div><div id="app"></div></main><script>
const app=document.querySelector('#app'),notice=document.querySelector('#notice');let isAdmin=false;
function node(tag,props={},...children){const n=document.createElement(tag);for(const [k,v] of Object.entries(props)){if(k==='text')n.textContent=v;else if(k==='className')n.className=v;else if(k==='value')n.value=v;else if(k==='onclick')n.onclick=v;else n.setAttribute(k,v)}for(const x of children.flat())if(x!=null)n.append(x instanceof Node?x:document.createTextNode(String(x)));return n}
const text=(tag,s)=>node(tag,{text:s}),button=(s,fn,style='')=>node('button',{className:'btn '+style,onclick:()=>run(fn)},s);
const run=async fn=>{try{notice.textContent='';await fn()}catch(e){notice.textContent=e.message;notice.style.color='#ff9b9b'}};
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'X-Requested-With':'LongtweetStudio',...(body?{'Content-Type':'application/json'}:{})},credentials:'same-origin',body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function markdown(str){let lines=String(str).split('\n'),inside=false;return lines.map(s=>{if(s.startsWith('~~~')){inside=!inside;return inside?'<pre><code>':'</code></pre>'}if(inside)return esc(s)+'\n';let v=esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');let h=v.match(/^(#{1,3}) (.*)$/);if(h)return '<h'+h[1].length+'>'+h[2]+'</h'+h[1].length+'>';if(v.startsWith('&gt; '))return '<blockquote>'+v.slice(5)+'</blockquote>';if(v.startsWith('- '))return '<p>• '+v.slice(2)+'</p>';return v.trim()?'<p>'+v+'</p>':''}).join('')}
const panel=title=>{app.replaceChildren();const p=node('section',{className:'panel'},text('h1',title));app.append(p);return p};
function login(){let p=panel('Admin login'),form=node('form'),field=node('input',{type:'password',placeholder:'Admin password',required:true,autocomplete:'current-password'});form.append(field,node('div',{className:'row'},node('button',{className:'btn',type:'submit'},'Sign in')));form.onsubmit=e=>{e.preventDefault();run(async()=>{await api('/api/login','POST',{password:field.value});await session();await dashboard()})};p.append(text('p','Sign in to create and manage your posts.'),form)}
async function session(){isAdmin=(await api('/api/session')).authenticated;document.querySelector('#admin').textContent=isAdmin?'Dashboard':'Admin'}
function card(p,admin){const c=node('article',{className:'card'},text('small',p.status+' · '+p.visibility),text('h2',p.title),text('p',p.excerpt||'No content'),text('small','Updated '+new Date(p.updatedAt).toLocaleDateString()));const row=node('div',{className:'row'});if(admin){row.append(button('Edit',()=>editor(p.id)),button('Duplicate',()=>duplicate(p.id),'secondary'));if(p.status==='published'&&p.visibility!=='private')row.append(node('a',{href:'/p/'+p.slug},'View'))}else row.append(node('a',{href:'/p/'+p.slug},'Read post'));c.append(row);return c}
async function dashboard(){if(!isAdmin)return login();const p=panel('Your long posts');p.append(text('p','Draft, edit, publish, and manage shareable posts.'));p.append(node('div',{className:'row'},button('New post',()=>editor(null)),button('Log out',async()=>{await api('/api/logout','POST');await session();login()},'secondary')));const posts=await api('/api/posts'),search=node('input',{type:'search',placeholder:'Search posts'}),filter=node('select',{},...['all','draft','published'].map(s=>node('option',{value:s},s))),grid=node('div',{className:'grid'});app.append(node('div',{className:'row'},search,filter),grid);function refresh(){const q=search.value.toLowerCase();const items=posts.filter(x=>(filter.value==='all'||x.status===filter.value)&&(x.title+' '+x.excerpt+' '+x.tags.join(' ')).toLowerCase().includes(q));grid.replaceChildren(...items.map(x=>card(x,true)));if(!items.length)grid.append(text('p','No matching posts.'))}search.oninput=refresh;filter.onchange=refresh;refresh()}
async function duplicate(id){const x=await api('/api/posts/'+id),y=await api('/api/posts','POST',{title:x.title+' (copy)',content:x.content,tags:x.tags,status:'draft',visibility:'private'});await editor(y.id)}
async function editor(id){if(!isAdmin)return login();const p0=id?await api('/api/posts/'+id):{title:'',content:'',tags:[],status:'draft',visibility:'unlisted'},p=panel(id?'Edit post':'Create post'),form=node('form'),title=node('input',{type:'text',required:true,maxlength:180,value:p0.title}),tags=node('input',{type:'text',value:p0.tags.join(', ')}),body=node('textarea',{maxlength:100000}),preview=node('div',{className:'preview'}),status=node('select',{},...['draft','published'].map(s=>node('option',{value:s},s))),visibility=node('select',{},...['public','unlisted','private'].map(s=>node('option',{value:s},s)));body.value=p0.content;status.value=p0.status;visibility.value=p0.visibility;function render(){preview.innerHTML=markdown(body.value)}body.oninput=render;render();form.append(text('label','Title'),title,text('label','Tags (comma-separated)'),tags,node('div',{className:'row'},node('div',{},text('label','Status'),status),node('div',{},text('label','Visibility'),visibility)),node('div',{className:'editgrid'},node('div',{},text('label','Markdown content'),body),node('div',{},text('label','Live preview'),preview)));const toolbar=node('div',{className:'row'},node('button',{className:'btn',type:'submit'},'Save'),button('Back',dashboard,'secondary'));if(id){if(p0.status==='published'&&p0.visibility!=='private')toolbar.append(button('Copy share URL',async()=>{await navigator.clipboard.writeText(location.origin+'/p/'+p0.slug);notice.textContent='Copied'}));toolbar.append(button('Delete',async()=>{if(confirm('Permanently delete this post?')){await api('/api/posts/'+id,'DELETE');await dashboard()}},'danger'))}form.append(toolbar);form.onsubmit=e=>{e.preventDefault();run(async()=>{const input={title:title.value,content:body.value,tags:tags.value,status:status.value,visibility:visibility.value},saved=await api(id?'/api/posts/'+id:'/api/posts',id?'PUT':'POST',input);await editor(saved.id);notice.textContent='Post saved'})};p.append(form)}
async function explore(){const p=panel('Explore long posts'),posts=await api('/api/public');p.append(text('p','Posts shared publicly from this site.'));app.append(node('div',{className:'grid'},...posts.map(x=>card(x,false))));if(!posts.length)p.append(text('p','No public posts yet.'))}
async function publicPost(slug){const x=await api('/api/public/'+slug),p=panel(x.title);p.append(text('p','Updated '+new Date(x.updatedAt).toLocaleDateString()));p.append(node('div',{},...x.tags.map(t=>node('span',{className:'tag'},t))));const preview=node('div',{className:'preview'});preview.innerHTML=markdown(x.content);p.append(preview,node('div',{className:'row'},button('Copy link',async()=>{await navigator.clipboard.writeText(location.href);notice.textContent='Copied'}),node('a',{href:'/posts'},'More posts')));document.title=x.title+' — Longtweet Studio'}
document.querySelector('#admin').onclick=()=>run(async()=>{await session();await dashboard()});
run(async()=>{await session();if(location.pathname.startsWith('/p/'))await publicPost(location.pathname.split('/')[2]);else if(location.pathname==='/posts')await explore();else await dashboard()});
</script></body></html>
